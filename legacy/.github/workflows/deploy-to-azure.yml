name: Deploy Multi-Container Apps to Azure

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push Docker image for Ads Api
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/myngly-ads-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/myngly-ads-api:${{ github.sha }}

  build-and-push-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push Docker image for Ads WebApp
        uses: docker/build-push-action@v5
        with:
          context: ./webapp
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/myngly-ads-webapp:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/myngly-ads-webapp:${{ github.sha }}

  build-and-push-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push Docker image for Ads Admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/myngly-ads-admin:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/myngly-ads-admin:${{ github.sha }}
