version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: myngly-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: myngly_ads
    volumes:
      - mongo_data:/data/db
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30

volumes:
  mongo_data:
